[phases.setup]
nixPkgs = ['php84', 'php84Packages.composer', 'nodejs_22']

[phases.install]
cmds = [
    'cp -n .env.example .env || true',
    'APP_URL=http://localhost composer install --optimize-autoloader --no-dev --no-interaction',
    'npm ci'
]

[phases.build]
cmds = [
    'APP_URL=http://localhost npm run build'
]

[start]
cmd = 'bash start.sh'
